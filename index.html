<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>تأیید پرداخت — ربات ساز فارکس</title>
  <style>
    :root {
      --bg: #0b1220; --card: #121a2b; --text: #e8eefc; --muted: #9aa8c7;
      --blue: #3b82f6; --green: #22c55e; --red: #ef4444;
      --border: rgba(148, 163, 184, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 440px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center;
    }
    .logo { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 22px; }
    .status { font-size: 1.05rem; font-weight: 700; line-height: 1.6; margin: 12px 0 8px; }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    .status.wait { color: #93c5fd; }
    .detail { color: var(--muted); font-size: 0.82rem; line-height: 1.7; margin-top: 8px; word-break: break-word; }
    .box {
      margin-top: 16px; text-align: right; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-size: 0.8rem; line-height: 1.8; color: var(--muted); display: none;
    }
    .box strong { color: var(--text); }
    .btn {
      display: inline-block; margin-top: 20px; padding: 12px 18px; border-radius: 10px;
      border: none; background: linear-gradient(135deg, var(--blue), #2563eb);
      color: #fff; font-weight: 700; font-size: 0.9rem; text-decoration: none; cursor: pointer;
    }
    .hint { margin-top: 16px; font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
    .ltr { direction: ltr; unicode-bidi: embed; font-size: 0.72rem; color: #cbd5e1; word-break: break-all; }
    .debug {
      margin-top: 12px; text-align: left; direction: ltr; font-size: 0.62rem;
      color: #64748b; word-break: break-all; max-height: 100px; overflow: auto;
      background: rgba(0,0,0,.25); padding: 8px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ربات ساز فارکس</div>
    <div class="sub">تأیید پرداخت کافه‌بازار</div>
    <div id="status" class="status wait">در حال بررسی پرداخت…</div>
    <div id="detail" class="detail"></div>
    <div id="receipt" class="box"></div>
    <button type="button" class="btn" id="openAppBtn" style="display:none">باز کردن برنامه</button>
    <div class="hint">
      اگر برنامه باز نشد، از کافه‌بازار آن را باز کنید و وارد حساب شوید.
    </div>
    <div id="debug" class="debug"></div>
  </div>
  <script>
(function () {
  var SUPABASE_URL = 'https://xkoukrklqdvczpmcqsrx.supabase.co';
  var ANON_KEY = 'sb_publishable_OK6XC9JrK3n1xa3ugAFcIw_k4tvrVoj';
  var VERIFY_URL = SUPABASE_URL + '/functions/v1/verify-bazaar-purchase';

  function qsAll() {
    var out = {};
    try {
      var sp = new URLSearchParams(window.location.search);
      sp.forEach(function (v, k) { out[k] = v; });
    } catch (e) {}
    // also parse hash ?a=1 style
    try {
      var h = (window.location.hash || '').replace(/^#/, '');
      if (h.indexOf('=') >= 0) {
        var sp2 = new URLSearchParams(h.indexOf('?') >= 0 ? h.split('?')[1] : h);
        sp2.forEach(function (v, k) { if (!out[k]) out[k] = v; });
      }
    } catch (e2) {}
    return out;
  }

  function qs(name) {
    var all = qsAll();
    return all[name] || null;
  }

  function setStatus(kind, title, detail) {
    var el = document.getElementById('status');
    var d = document.getElementById('detail');
    el.className = 'status ' + (kind || '');
    el.textContent = title || '';
    d.textContent = detail || '';
    if (kind === 'ok') document.getElementById('openAppBtn').style.display = 'inline-block';
  }

  function dbg(msg) {
    try { document.getElementById('debug').textContent = String(msg || ''); } catch (e) {}
  }

  function formatUntil(iso) {
    if (!iso) return '—';
    try {
      var dt = new Date(iso);
      if (isNaN(dt.getTime())) return String(iso);
      return dt.toLocaleDateString('fa-IR');
    } catch (e) { return String(iso); }
  }

  function showReceipt(info) {
    var box = document.getElementById('receipt');
    box.style.display = 'block';
    var lines = [];
    if (info.sku) lines.push('<div><strong>محصول:</strong> ' + info.sku + '</div>');
    if (info.amount != null) lines.push('<div><strong>مبلغ:</strong> ' + Number(info.amount).toLocaleString('fa-IR') + ' تومان</div>');
    if (info.pro_until) lines.push('<div><strong>اعتبار تا:</strong> ' + formatUntil(info.pro_until) + '</div>');
    if (info.token_short) lines.push('<div><strong>توکن:</strong> <span class="ltr">' + info.token_short + '</span></div>');
    box.innerHTML = lines.join('');
  }

  function xhrPost(url, jsonBody, useAuth) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      if (useAuth) {
        try { xhr.setRequestHeader('apikey', ANON_KEY); } catch (e1) {}
        try { xhr.setRequestHeader('Authorization', 'Bearer ' + ANON_KEY); } catch (e2) {}
      }
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        var data = {};
        try { data = xhr.responseText ? JSON.parse(xhr.responseText) : {}; }
        catch (e) { data = { raw: String(xhr.responseText || '').slice(0, 200) }; }
        resolve({ status: xhr.status, ok: xhr.status >= 200 && xhr.status < 300, data: data });
      };
      xhr.onerror = function () { reject(new Error('network_error')); };
      xhr.timeout = 30000;
      xhr.ontimeout = function () { reject(new Error('timeout')); };
      xhr.send(jsonBody);
    });
  }

  function pickToken(all) {
    var keys = ['purchaseToken', 'token', 'purchase_token', 'purchaseData', 'data', 'purchaseToken'.toLowerCase()];
    for (var i = 0; i < keys.length; i++) {
      if (all[keys[i]]) return all[keys[i]];
    }
    // scan any key containing "token"
    for (var k in all) {
      if (/token/i.test(k) && all[k]) return all[k];
    }
    return '';
  }

  function pickUid(all) {
    return all.u || all.uid || all.userId || all.user_id || '';
  }

  function pickSku(all) {
    return all.s || all.sku || all.productId || 'frbtest';
  }

  function loadPending() {
    try {
      var raw = localStorage.getItem('frb_bazaar_pending') || sessionStorage.getItem('frb_bazaar_pending');
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }

  document.getElementById('openAppBtn').onclick = function () {
    try { window.location.href = 'forexrobotbuilder://home'; } catch (e) {}
  };

  function run() {
    var all = qsAll();
    var token = pickToken(all);
    var uid = pickUid(all);
    var sku = pickSku(all);
    var email = all.email || '';
    var response = all.response || '';
    var pending = loadPending();

    // If same WebView as app, pending may have uid
    if (!uid && pending && pending.userId) uid = pending.userId;
    if ((!sku || sku === 'frbtest') && pending && pending.sku) sku = pending.sku;
    if (!email && pending && pending.email) email = pending.email;

    dbg(
      'href=' + String(window.location.href).slice(0, 180) +
      '\nkeys=' + Object.keys(all).join(',') +
      '\nsku=' + sku +
      ' uid=' + (uid ? String(uid).slice(0, 8) + '…' : 'none') +
      ' token=' + (token ? String(token).slice(0, 10) + '…' : 'none') +
      ' pending=' + (pending ? 'yes' : 'no')
    );

    if (response && response !== 'ok' && !token) {
      setStatus('err', 'پرداخت انجام نشد یا لغو شد.', 'به برنامه برگردید و دوباره تلاش کنید.');
      return;
    }
    if (!token) {
      setStatus('err', 'رسید پرداخت (purchaseToken) در آدرس برگشت نیست.',
        'بازار باید بعد از پرداخت توکن را به آدرس سایت اضافه کند. آدرس کامل نوار مرورگر را برای پشتیبانی بفرستید.');
      return;
    }
    if (!uid) {
      setStatus('err', 'شناسه کاربر در آدرس نیست.',
        'از داخل اپ وارد حساب شوید و دوباره پرداخت کنید.');
      return;
    }

    setStatus('wait', 'در حال تأیید خرید…', 'لطفاً صبر کنید.');

    var amount = (String(sku).toLowerCase() === 'frbtest') ? 10000 : 300000;
    if (pending && pending.amount) amount = pending.amount;

    var body = JSON.stringify({
      userId: String(uid),
      email: String(email),
      sku: String(sku),
      purchaseToken: String(token),
      plan: 'pro',
      gateway: 'bazaar',
      amount: amount,
      currency: 'IRT'
    });

    xhrPost(VERIFY_URL, body, true)
      .catch(function () { return xhrPost(VERIFY_URL, body, false); })
      .then(function (result) {
        var data = result.data || {};
        if (!result.ok || data.ok === false || data.error) {
          throw new Error(data.error || data.detail || ('HTTP ' + result.status));
        }
        try {
          localStorage.removeItem('frb_bazaar_pending');
          sessionStorage.removeItem('frb_bazaar_pending');
        } catch (e) {}
        var until = data.pro_until || (data.purchase && data.purchase.pro_until);
        var untilText = until
          ? ('اشتراک Pro تا ' + formatUntil(until) + ' فعال است.')
          : 'اشتراک Pro فعال شد.';
        setStatus('ok', 'خرید شما تأیید شد.', untilText + ' برنامه را باز کنید.');
        showReceipt({
          sku: data.sku || sku,
          amount: amount,
          pro_until: until,
          token_short: String(token).slice(0, 12) + '…'
        });
      })
      .catch(function (err) {
        setStatus('err', 'تأیید خرید ناموفق بود.',
          (err && err.message ? err.message : String(err)) +
          ' اگر مبلغ کم شده به پشتیبانی پیام دهید.');
      });
  }

  run();
})();
  </script>
</body>
</html>
